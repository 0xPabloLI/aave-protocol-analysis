# Local development services (backend PostgreSQL archive).
# Usage: docker compose up -d postgres
# Then set DATABASE_URL=postgres://postgres:postgres@localhost:5432/aave_archive
# in backend/.env — persistenceService treats DB as opt-in, so leaving it unset
# keeps the API in memory-only mode.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aave_archive
    ports:
      - "5432:5432"
    volumes:
      - aave_pgdata:/var/lib/postgresql/data
      # Apply the archive schema on first boot.
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aave_pgdata:
