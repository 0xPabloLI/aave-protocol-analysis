name = "aave-browser-rendering"
main = "src/index.ts"
# CRITICAL: Updated to 2024-09-23+ to auto-enable nodejs_compat_v2
# Or use compatibility_flags = ["nodejs_compat_v2"] for older dates
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat_v2"]

# Browser Rendering binding
# Official format: browser = {binding="MY_BROWSER"}
browser = {binding="MY_BROWSER"}

# Durable Object binding
[[durable_objects.bindings]]
name = "BROWSER_POOL"
class_name = "BrowserPool"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BrowserPool"]

# Node.js compatibility (needed for Puppeteer)
[build]
command = "npm run build"

[env.production]
name = "aave-browser-rendering"
