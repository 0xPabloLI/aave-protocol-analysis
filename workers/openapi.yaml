openapi: "3.0.3"
info:
  title: aave-browser-rendering
  version: "1.0.0"
  description: >
    Cloudflare Worker exposing a Puppeteer Browser Rendering pool (Durable
    Object) used by the fetcher as the Merit dynamic-info fallback.
servers:
  - url: https://aave-browser-rendering.workers.dev
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Worker is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /limits:
    get:
      summary: Browser Rendering plan limits
      operationId: getLimits
      responses:
        "200":
          description: Quota lookup result (success may be false when the binding is unavailable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  limits:
                    type: object
                    nullable: true
                  error:
                    type: string
  /:
    post:
      summary: Browser-pool action (Durable Object)
      operationId: postAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum:
                    - extractCampaignInfo
                    - extractSelfAuth
                    - extractDynamicInfo
                    - debugSessions
                    - closeBrowserInstances
                    - getStats
                key:
                  type: string
                  description: Target URL; required for all extract* actions.
      responses:
        "200":
          description: Action result
        "400":
          description: Missing action or key
        "405":
          description: Method not allowed (POST only)
        "429":
          description: Launch rate limit exceeded (free plan sliding window)
