services:
  - type: web
    name: aave-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build && cd backend && npm install && npm run build
    startCommand: cd backend && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
    healthCheckPath: /health
    disk:
      name: data-disk
      mountPath: /app/data
      sizeGB: 1

