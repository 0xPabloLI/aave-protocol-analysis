name: Auto Approve Bot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Job 1: github-actions[bot] PRs (ci-remediation, subgraph-sync)
  approve-github-actions-pr:
    if: >
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      (
        startsWith(github.event.pull_request.head.ref, 'bot/ci-auto-remediation-') ||
        startsWith(github.event.pull_request.head.ref, 'bot/subgraph-sync-')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Policy-check changed files, approve, and enable auto-merge
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const branch = context.payload.pull_request.head.ref;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            // Define allowed files per bot PR type
            let allowed;
            let policyLabel;

            if (branch.startsWith('bot/ci-auto-remediation-')) {
              allowed = new Set([
                'package.json',
                'package-lock.json',
                'backend/package.json',
                'backend/package-lock.json',
              ]);
              policyLabel = 'CI auto-remediation';
            } else if (branch.startsWith('bot/subgraph-sync-')) {
              allowed = new Set([
                'docs/api/aave-subgraph-deployments.snapshot.json',
              ]);
              policyLabel = 'Subgraph sync';
            } else {
              core.setFailed(`Unknown bot branch pattern: ${branch}`);
              return;
            }

            const disallowed = files
              .map((file) => file.filename)
              .filter((filename) => !allowed.has(filename));

            if (disallowed.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: [
                  `${policyLabel} PR contains disallowed file changes.`,
                  '',
                  ...disallowed.map((name) => `- \`${name}\``),
                  '',
                  'Skipping auto-approval and auto-merge.',
                ].join('\n'),
              });
              core.setFailed('Disallowed files found in bot PR');
              return;
            }

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: `${policyLabel}: automated review passed policy checks.`,
            });

            // Retry enableAutoMerge — CI checks may still be pending ("unstable status")
            const maxAttempts = 5;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              try {
                await github.graphql(
                  `
                  mutation EnableAutoMerge($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                      pullRequest { number }
                    }
                  }
                  `,
                  { pullRequestId: context.payload.pull_request.node_id }
                );
                core.info(`Auto-merge enabled on attempt ${attempt}`);
                break;
              } catch (error) {
                if (attempt === maxAttempts) {
                  core.warning(`Enable auto-merge failed after ${maxAttempts} attempts: ${error.message}`);
                } else {
                  core.info(`Attempt ${attempt} failed (${error.message}), retrying in 30s...`);
                  await new Promise(r => setTimeout(r, 30000));
                }
              }
            }

  # Job 2: Dependabot PRs — auto-merge security updates only
  approve-dependabot-pr:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-approve and merge security updates
        if: >
          steps.metadata.outputs.is-security-update == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const ecosystem = '${{ steps.metadata.outputs.package-ecosystem }}';
            const updateType = '${{ steps.metadata.outputs.update-type }}';

            const label = ecosystem === 'github_actions'
              ? `GitHub Actions update (${updateType})`
              : `Dependabot ${updateType.replace('version-update:semver-', '')} update`;

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: `${label}: auto-approved.`,
            });

            // Retry enableAutoMerge — CI checks may still be pending
            const maxAttempts = 5;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              try {
                await github.graphql(
                  `
                  mutation EnableAutoMerge($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                      pullRequest { number }
                    }
                  }
                  `,
                  { pullRequestId: context.payload.pull_request.node_id }
                );
                core.info(`Auto-merge enabled on attempt ${attempt}`);
                break;
              } catch (error) {
                if (attempt === maxAttempts) {
                  core.warning(`Enable auto-merge failed after ${maxAttempts} attempts: ${error.message}`);
                } else {
                  core.info(`Attempt ${attempt} failed (${error.message}), retrying in 30s...`);
                  await new Promise(r => setTimeout(r, 30000));
                }
              }
            }

      - name: Comment on major npm updates
        if: >
          steps.metadata.outputs.update-type == 'version-update:semver-major' &&
          steps.metadata.outputs.package-ecosystem != 'github_actions'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: [
                '⚠️ **Major version bump detected** — skipping auto-merge.',
                '',
                `- Package: \`${{ steps.metadata.outputs.dependency-names }}\``,
                `- Update: \`${{ steps.metadata.outputs.previous-version }}\` → \`${{ steps.metadata.outputs.new-version }}\``,
                '',
                'Please review manually for breaking changes.',
              ].join('\n'),
            });
