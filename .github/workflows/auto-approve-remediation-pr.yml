name: Auto Approve Bot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Job 1: github-actions[bot] PRs (ci-remediation, subgraph-sync)
  approve-github-actions-pr:
    if: >
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      (
        startsWith(github.event.pull_request.head.ref, 'bot/ci-auto-remediation-') ||
        startsWith(github.event.pull_request.head.ref, 'bot/subgraph-sync-')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Policy-check changed files, approve, and enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const branch = context.payload.pull_request.head.ref;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            // Define allowed files per bot PR type
            let allowed;
            let policyLabel;

            if (branch.startsWith('bot/ci-auto-remediation-')) {
              allowed = new Set([
                'package.json',
                'package-lock.json',
                'backend/package.json',
                'backend/package-lock.json',
              ]);
              policyLabel = 'CI auto-remediation';
            } else if (branch.startsWith('bot/subgraph-sync-')) {
              allowed = new Set([
                'docs/api/aave-subgraph-deployments.snapshot.json',
              ]);
              policyLabel = 'Subgraph sync';
            } else {
              core.setFailed(`Unknown bot branch pattern: ${branch}`);
              return;
            }

            const disallowed = files
              .map((file) => file.filename)
              .filter((filename) => !allowed.has(filename));

            if (disallowed.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: [
                  `${policyLabel} PR contains disallowed file changes.`,
                  '',
                  ...disallowed.map((name) => `- \`${name}\``),
                  '',
                  'Skipping auto-approval and auto-merge.',
                ].join('\n'),
              });
              core.setFailed('Disallowed files found in bot PR');
              return;
            }

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: `${policyLabel}: automated review passed policy checks.`,
            });

            try {
              await github.graphql(
                `
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                    pullRequest {
                      number
                    }
                  }
                }
                `,
                { pullRequestId: context.payload.pull_request.node_id }
              );
            } catch (error) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `Auto-approval succeeded, but enabling auto-merge failed: ${error.message}`,
              });
              throw error;
            }

  # Job 2: Dependabot PRs — auto-merge patch & minor, skip major
  approve-dependabot-pr:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-approve and merge patch/minor updates
        if: >
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: 'Dependabot patch/minor update: auto-approved.',
            });

            try {
              await github.graphql(
                `
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                    pullRequest {
                      number
                    }
                  }
                }
                `,
                { pullRequestId: context.payload.pull_request.node_id }
              );
            } catch (error) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `Auto-approval succeeded, but enabling auto-merge failed: ${error.message}`,
              });
              throw error;
            }

      - name: Comment on major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: [
                '⚠️ **Major version bump detected** — skipping auto-merge.',
                '',
                `- Package: \`${{ steps.metadata.outputs.dependency-names }}\``,
                `- Update: \`${{ steps.metadata.outputs.previous-version }}\` → \`${{ steps.metadata.outputs.new-version }}\``,
                '',
                'Please review manually for breaking changes.',
              ].join('\n'),
            });
