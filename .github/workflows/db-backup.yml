name: Database Backup to Cloudflare R2

# PG dump → upload to Cloudflare R2 (S3-compatible).
#
# Modes:
#   daily  (default): writes to R2 daily/ prefix, scheduled 03:00 UTC
#   archive:          writes to R2 archive/ prefix (permanent), triggered on-demand
#
# Retention:
#   daily/   keeps the 7 most recent backups, older ones auto-deleted after each upload
#   archive/ keeps the 20 most recent backups, older ones auto-deleted after each upload
#            also clears daily/ on success (daily snapshots superseded by archive)
#            Archive runs fire when the DB crosses ARCHIVE_THRESHOLD_BYTES (3 GB,
#            roughly monthly), so 20 slots ≈ 20 months of monthly restore points,
#            each one carrying the ~month of rows it held at that moment. Worst
#            case that is 20 × 274 MB + 7 × 267 MB ≈ 7.4 GB, still inside the
#            10 GB free tier. Crossing r2-cleanup.yml's 8 GB line only files an
#            issue — nothing is ever deleted early.
#
# Backs up staging database only (production DB not deployed).
#
# Required GitHub Secrets:
#   DATABASE_URL_PUBLIC_STAGING     Railway staging PG public connection string
#   R2_ENDPOINT                     https://<account-id>.r2.cloudflarestorage.com
#   R2_ACCESS_KEY_ID                Cloudflare R2 API token Access Key
#   R2_SECRET_ACCESS_KEY            Cloudflare R2 API token Secret
#   R2_BUCKET                       Bucket name (e.g. aave-db-backups)

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily → defaults to mode=daily
  workflow_dispatch:
    inputs:
      mode:
        description: "Backup mode: daily or archive"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - archive

permissions:
  contents: read
  issues: write

# Single source of truth for R2 retention. `r2-cleanup.yml` reads the same two
# values — its weekly pass is a safety net for this workflow, never a stricter
# policy — and backend/tests/dbBackupWorkflow.test.ts fails if the two files
# drift apart.
env:
  KEEP_DAILY: 7
  KEEP_ARCHIVE: 20

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [staging]
    concurrency:
      group: db-backup-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      MODE: ${{ github.event.inputs.mode || 'daily' }}
    steps:
      - name: Install postgresql-client-18
        run: |
          set -euo pipefail
          sudo apt-get remove -y postgresql-client-16 || true
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump ${{ matrix.environment }} database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PUBLIC_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL_PUBLIC_${{ matrix.environment }} secret is not set" >&2
            exit 1
          fi
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          FILE="${{ matrix.environment }}-aave-pg-${STAMP}.dump"
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" -Fc -Z9 -f "$FILE"
          ls -lh "$FILE"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          R2_KEY="${MODE}/${BACKUP_FILE}"
          # R2 intermittently rejects CompleteMultipartUpload with InvalidPart —
          # a part ETag it no longer recognises. That is a 4xx, so aws-cli does
          # not retry it, and the whole dump is discarded while the file on the
          # runner dies with the job: 2026-11-08 left a permanent gap that way.
          # Retrying starts a fresh multipart upload id, so a stale part list
          # cannot survive into the next attempt.
          for attempt in 1 2 3; do
            if aws s3 cp "$BACKUP_FILE" "s3://${R2_BUCKET}/${R2_KEY}" \
                 --endpoint-url "$R2_ENDPOINT" \
                 --region auto \
                 --no-progress; then
              echo "Upload succeeded on attempt ${attempt}"
              echo "R2_KEY=$R2_KEY" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::Upload attempt ${attempt}/3 failed; retrying in $((attempt * 15))s"
            sleep "$((attempt * 15))"
          done
          echo "::error::Upload to s3://${R2_BUCKET}/${R2_KEY} failed after 3 attempts"
          exit 1

      - name: Verify upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 ls "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto

      - name: Prune old daily backups (keep ${{ env.KEEP_DAILY }} most recent)
        if: env.MODE == 'daily'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          echo "=== Pruning old daily/ backups (keeping ${KEEP_DAILY} most recent) ==="
          # List daily/ objects sorted by date (newest first)
          aws s3 ls "s3://${R2_BUCKET}/daily/" \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto 2>&1 | sort -rk1,2 > /tmp/daily-listing.txt

          TOTAL_DAILY=$(wc -l < /tmp/daily-listing.txt)
          echo "Total daily/ objects: $TOTAL_DAILY"

          if [ "$TOTAL_DAILY" -le "$KEEP_DAILY" ]; then
            echo "Only $TOTAL_DAILY daily/ objects, nothing to prune."
            exit 0
          fi

          echo "Keeping the ${KEEP_DAILY} newest daily/ backups:"
          head -"$KEEP_DAILY" /tmp/daily-listing.txt

          echo "Deleting old daily/ backups:"
          tail -n +"$((KEEP_DAILY + 1))" /tmp/daily-listing.txt | awk '{print $4}' | while read -r KEY; do
            echo "  Deleting: daily/$KEY"
            aws s3 rm "s3://${R2_BUCKET}/daily/${KEY}" \
              --endpoint-url "$R2_ENDPOINT" \
              --region auto || echo "  Failed to delete: daily/$KEY"
          done

          echo "=== Pruning complete ==="

      - name: Clear daily/ prefix after successful archive
        if: env.MODE == 'archive'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          echo "Archive backup succeeded — clearing daily/ prefix for ${{ matrix.environment }}"
          aws s3 rm "s3://${R2_BUCKET}/daily/" \
            --recursive \
            --exclude "*" \
            --include "${{ matrix.environment }}-aave-pg-*" \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto || true

      - name: Prune old archive backups (keep ${{ env.KEEP_ARCHIVE }} most recent)
        if: env.MODE == 'archive'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          echo "=== Pruning old archive/ backups (keeping ${KEEP_ARCHIVE} most recent) ==="
          aws s3 ls "s3://${R2_BUCKET}/archive/" \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto 2>&1 | sort -rk1,2 > /tmp/archive-listing.txt

          TOTAL_ARCHIVE=$(wc -l < /tmp/archive-listing.txt)
          echo "Total archive/ objects: $TOTAL_ARCHIVE"

          if [ "$TOTAL_ARCHIVE" -le "$KEEP_ARCHIVE" ]; then
            echo "Only $TOTAL_ARCHIVE archive/ objects, nothing to prune."
            exit 0
          fi

          echo "Keeping the ${KEEP_ARCHIVE} newest archive/ backups:"
          head -"$KEEP_ARCHIVE" /tmp/archive-listing.txt

          echo "Deleting old archive/ backups:"
          tail -n +"$((KEEP_ARCHIVE + 1))" /tmp/archive-listing.txt | awk '{print $4}' | while read -r KEY; do
            echo "  Deleting: archive/$KEY"
            aws s3 rm "s3://${R2_BUCKET}/archive/${KEY}" \
              --endpoint-url "$R2_ENDPOINT" \
              --region auto || echo "  Failed to delete: archive/$KEY"
          done

          echo "=== Pruning complete ==="

      # A missed nightly dump used to be invisible: 2026-11-08 lost its backup to
      # a transient R2 multipart error (InvalidPart) and nothing reported it —
      # the next day just carried on. Surface a failure on the repo so a gap in
      # the daily series is visible without reading the Actions tab.
      - name: Report failure as an issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # Passed through the environment rather than inlined as ${{ }}, so the
          # script stays valid JavaScript and can be syntax-checked locally.
          BACKUP_ENVIRONMENT: ${{ matrix.environment }}
        with:
          github-token: ${{ secrets.CODEX_BOT_TOKEN != '' && secrets.CODEX_BOT_TOKEN || github.token }}
          script: |
            const label = 'db-backup-failure';
            const environment = process.env.BACKUP_ENVIRONMENT;
            const mode = process.env.MODE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Database backup failed',
              '',
              `**Environment**: ${environment}`,
              `**Mode**: ${mode}`,
              `**Run**: ${runUrl}`,
              '',
              'The dump may have completed without reaching R2. Daily backups are',
              'full dumps, so the previous snapshots are still intact — only this',
              'point in time is missing. Check the failed step in the run log.',
            ].join('\n');

            // GitHub silently drops labels that do not exist at issue-create
            // time, which would leave the alert unfindable by the dedupe query
            // below: every failed run would then open a NEW issue instead of
            // commenting on the open one. Ensure the label exists first rather
            // than relying on someone having added it by hand.
            //
            // Every failure here is downgraded to a warning on purpose: losing
            // the dedupe is a duplicate issue, losing the alert is a silently
            // missing backup. Never let the bookkeeping block the alert.
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (lookupError) {
              if (lookupError.status !== 404) {
                core.warning(`could not check label ${label}: ${lookupError.message}`);
              } else {
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo,
                    name: label,
                    color: 'ededed',
                    description: 'Daily staging DB backup failed to reach R2',
                  });
                  core.info(`Created missing label ${label}`);
                } catch (createError) {
                  // 422 = a concurrent run created it first; anything else means
                  // the issue below gets filed without the label (still an alert).
                  if (createError.status !== 422) {
                    core.warning(`could not create label ${label}: ${createError.message}`);
                  }
                }
              }
            }

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              labels: label,
              state: 'open',
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open[0].number,
                body,
              });
              core.info(`Commented on existing issue #${open[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                ...context.repo,
                title: `Database backup failed (${context.workflow})`,
                body,
                labels: [label, 'ci-failure'],
              });
              core.info(`Created issue #${created.number}`);
            }
