name: Database Backup to Cloudflare R2

# PG dump → upload to Cloudflare R2 (S3-compatible).
#
# Modes:
#   daily  (default): writes to R2 daily/ prefix, scheduled 03:00 UTC
#   archive:          writes to R2 archive/ prefix (permanent), triggered on-demand
#
# Retention:
#   daily/   keeps the 7 most recent backups, older ones auto-deleted after each upload
#   archive/ keeps the 4 most recent backups, older ones auto-deleted after each upload
#            also clears daily/ on success (daily snapshots superseded by archive)
#
# Backs up staging database only (production DB not deployed).
#
# Required GitHub Secrets:
#   DATABASE_URL_PUBLIC_STAGING     Railway staging PG public connection string
#   R2_ENDPOINT                     https://<account-id>.r2.cloudflarestorage.com
#   R2_ACCESS_KEY_ID                Cloudflare R2 API token Access Key
#   R2_SECRET_ACCESS_KEY            Cloudflare R2 API token Secret
#   R2_BUCKET                       Bucket name (e.g. aave-db-backups)

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily → defaults to mode=daily
  workflow_dispatch:
    inputs:
      mode:
        description: "Backup mode: daily or archive"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - archive

permissions: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [staging]
    concurrency:
      group: db-backup-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      MODE: ${{ github.event.inputs.mode || 'daily' }}
    steps:
      - name: Install postgresql-client-18
        run: |
          set -euo pipefail
          sudo apt-get remove -y postgresql-client-16 || true
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump ${{ matrix.environment }} database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PUBLIC_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL_PUBLIC_${{ matrix.environment }} secret is not set" >&2
            exit 1
          fi
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          FILE="${{ matrix.environment }}-aave-pg-${STAMP}.dump"
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" -Fc -Z9 -f "$FILE"
          ls -lh "$FILE"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          R2_KEY="${MODE}/${BACKUP_FILE}"
          aws s3 cp "$BACKUP_FILE" "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto \
            --no-progress
          echo "R2_KEY=$R2_KEY" >> "$GITHUB_ENV"

      - name: Verify upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 ls "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto

      - name: Prune old daily backups (keep 7 most recent)
        if: env.MODE == 'daily'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          echo "=== Pruning old daily/ backups (keeping 7 most recent) ==="
          # List daily/ objects sorted by date (newest first)
          aws s3 ls "s3://${R2_BUCKET}/daily/" \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto 2>&1 | sort -rk1,2 > /tmp/daily-listing.txt

          TOTAL_DAILY=$(wc -l < /tmp/daily-listing.txt)
          echo "Total daily/ objects: $TOTAL_DAILY"

          if [ "$TOTAL_DAILY" -le 7 ]; then
            echo "Only $TOTAL_DAILY daily/ objects, nothing to prune."
            exit 0
          fi

          echo "Keeping the 7 newest daily/ backups:"
          head -7 /tmp/daily-listing.txt

          echo "Deleting old daily/ backups:"
          tail -n +8 /tmp/daily-listing.txt | awk '{print $4}' | while read -r KEY; do
            echo "  Deleting: daily/$KEY"
            aws s3 rm "s3://${R2_BUCKET}/daily/${KEY}" \
              --endpoint-url "$R2_ENDPOINT" \
              --region auto || echo "  Failed to delete: daily/$KEY"
          done

          echo "=== Pruning complete ==="

      - name: Clear daily/ prefix after successful archive
        if: env.MODE == 'archive'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          echo "Archive backup succeeded — clearing daily/ prefix for ${{ matrix.environment }}"
          aws s3 rm "s3://${R2_BUCKET}/daily/" \
            --recursive \
            --exclude "*" \
            --include "${{ matrix.environment }}-aave-pg-*" \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto || true

      - name: Prune old archive backups (keep 4 most recent)
        if: env.MODE == 'archive'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          echo "=== Pruning old archive/ backups (keeping 4 most recent) ==="
          aws s3 ls "s3://${R2_BUCKET}/archive/" \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto 2>&1 | sort -rk1,2 > /tmp/archive-listing.txt

          TOTAL_ARCHIVE=$(wc -l < /tmp/archive-listing.txt)
          echo "Total archive/ objects: $TOTAL_ARCHIVE"

          if [ "$TOTAL_ARCHIVE" -le 4 ]; then
            echo "Only $TOTAL_ARCHIVE archive/ objects, nothing to prune."
            exit 0
          fi

          echo "Keeping the 4 newest archive/ backups:"
          head -4 /tmp/archive-listing.txt

          echo "Deleting old archive/ backups:"
          tail -n +5 /tmp/archive-listing.txt | awk '{print $4}' | while read -r KEY; do
            echo "  Deleting: archive/$KEY"
            aws s3 rm "s3://${R2_BUCKET}/archive/${KEY}" \
              --endpoint-url "$R2_ENDPOINT" \
              --region auto || echo "  Failed to delete: archive/$KEY"
          done

          echo "=== Pruning complete ==="
