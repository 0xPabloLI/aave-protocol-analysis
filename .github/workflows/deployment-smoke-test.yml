# Post-deployment smoke test: verify live APIs return healthy data after Railway deploy.
# Runs health + API checks once Railway reports deploy success (no long SHA wait loop).
# On failure: auto-rollback via Railway GraphQL API (both staging and production).
#
# Trigger: deployment_status (after Railway deploys), NOT push — avoids deadlock
# with Railway's "Wait for CI" which blocks deploy until all push-triggered
# check suites pass. Railway deploys after CI passes, sends deployment_status
# to GitHub, then this workflow runs as post-deploy verification.
#
# Required GitHub secrets (per environment):
#   RAILWAY_API_TOKEN                    (shared)
#   RAILWAY_STAGING_PROJECT_ID           RAILWAY_PRODUCTION_PROJECT_ID
#   RAILWAY_STAGING_SERVICE_ID           RAILWAY_PRODUCTION_SERVICE_ID
#   RAILWAY_STAGING_ENVIRONMENT_ID       RAILWAY_PRODUCTION_ENVIRONMENT_ID
name: Deployment Smoke Test

on:
  deployment_status:

permissions:
  contents: read
  issues: write

# Cancel in-progress runs for the same deployment target environment.
concurrency:
  group: smoke-test-${{ github.event.deployment.environment || github.event.deployment.ref || github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  smoke-test:
    # Only run on successful Railway deployments; target environment is resolved in-step
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.target.outputs.should_run }}
      deploy_branch: ${{ steps.target.outputs.deploy_branch }}
      deploy_sha: ${{ steps.target.outputs.deploy_sha }}
      environment_label: ${{ steps.target.outputs.environment_label }}
      api_base_url: ${{ steps.target.outputs.api_base_url }}
      site_url: ${{ steps.target.outputs.site_url }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Resolve deployment target
        id: target
        env:
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
        run: |
          TARGET_JSON=$(node --input-type=module -e "
            import { resolveDeploymentTarget } from './.github/scripts/deployment-smoke-test-helpers.mjs';
            const target = resolveDeploymentTarget({
              ref: process.env.DEPLOYMENT_REF,
              sha: process.env.DEPLOYMENT_SHA,
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
            });
            console.log(JSON.stringify(target));
          ")

          SHOULD_RUN=$(echo "$TARGET_JSON" | jq -r '.shouldRun')
          DEPLOY_BRANCH=$(echo "$TARGET_JSON" | jq -r '.deployBranch')
          DEPLOY_SHA=$(echo "$TARGET_JSON" | jq -r '.deploySha')
          ENV_LABEL=$(echo "$TARGET_JSON" | jq -r '.environmentLabel')
          API_BASE_URL=$(echo "$TARGET_JSON" | jq -r '.apiBaseUrl')
          SITE_URL=$(echo "$TARGET_JSON" | jq -r '.siteUrl')

          {
            echo "should_run=$SHOULD_RUN"
            echo "deploy_branch=$DEPLOY_BRANCH"
            echo "deploy_sha=$DEPLOY_SHA"
            echo "environment_label=$ENV_LABEL"
            echo "api_base_url=$API_BASE_URL"
            echo "site_url=$SITE_URL"
          } >> "$GITHUB_OUTPUT"

          {
            echo "DEPLOY_BRANCH=$DEPLOY_BRANCH"
            echo "DEPLOY_SHA=$DEPLOY_SHA"
            echo "ENV_LABEL=$ENV_LABEL"
            echo "API_BASE_URL=$API_BASE_URL"
            echo "SITE_URL=$SITE_URL"
          } >> "$GITHUB_ENV"

      - name: Skip unsupported deployment target
        if: steps.target.outputs.should_run != 'true'
        run: |
          echo "Skipping deployment_status event for non-target deployment."
          echo "ref='${{ github.event.deployment.ref }}' environment='${{ github.event.deployment.environment }}'"

      - name: Health check
        id: health
        if: steps.target.outputs.should_run == 'true'
        run: |
          echo "🏥 Checking ${{ env.ENV_LABEL }} health endpoint..."
          HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            "${{ env.API_BASE_URL }}/health")

          echo "HTTP status: $HTTP_CODE"
          cat /tmp/health.json | jq . 2>/dev/null || cat /tmp/health.json

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Health check failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Health check passed"

      - name: API /api/markets data check
        id: markets
        if: steps.target.outputs.should_run == 'true'
        run: |
          echo "📊 Checking ${{ env.ENV_LABEL }} /api/markets..."
          HTTP_CODE=$(curl -s -o /tmp/markets.json -w "%{http_code}" \
            --max-time 60 --retry 3 --retry-delay 30 --retry-all-errors \
            "${{ env.API_BASE_URL }}/api/markets")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ /api/markets returned HTTP $HTTP_CODE"
            exit 1
          fi

          # Validate response structure: must have reserves array with data
          RESERVE_COUNT=$(jq '.reserves | length' /tmp/markets.json 2>/dev/null || echo "0")
          echo "Reserve count: $RESERVE_COUNT"

          if [ "$RESERVE_COUNT" -lt 50 ]; then
            echo "❌ Too few reserves ($RESERVE_COUNT < 50), data may be incomplete"
            jq '{snapshot: .snapshot, reserveCount: (.reserves | length)}' /tmp/markets.json 2>/dev/null
            exit 1
          fi

          # Check snapshot metadata exists
          HAS_SNAPSHOT=$(jq 'has("snapshot")' /tmp/markets.json 2>/dev/null || echo "false")
          if [ "$HAS_SNAPSHOT" != "true" ]; then
            echo "❌ Missing snapshot metadata in response"
            exit 1
          fi

          echo "✅ /api/markets OK — $RESERVE_COUNT reserves"

      - name: API /api/meta/side-data check
        id: sidedata
        if: steps.target.outputs.should_run == 'true'
        run: |
          echo "📦 Checking ${{ env.ENV_LABEL }} /api/meta/side-data..."
          HTTP_CODE=$(curl -s -o /tmp/sidedata.json -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 30 --retry-all-errors \
            "${{ env.API_BASE_URL }}/api/meta/side-data")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ /api/meta/side-data returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ /api/meta/side-data OK"

      - name: Frontend accessibility check
        id: frontend
        if: steps.target.outputs.should_run == 'true'
        run: |
          echo "🌐 Checking ${{ env.ENV_LABEL }} frontend (${{ env.SITE_URL }})..."
          HTTP_CODE=$(curl -s -o /tmp/frontend.html -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 30 --retry-all-errors \
            -L "${{ env.SITE_URL }}")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "⚠️ Frontend returned HTTP $HTTP_CODE (may be expected if frontend deploys separately)"
          else
            echo "✅ Frontend accessible"
          fi

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "  Smoke Test Summary (${{ env.ENV_LABEL }})"
          echo "========================================"
          echo "  Branch:     ${{ env.DEPLOY_BRANCH }}"
          echo "  Commit:     ${{ env.DEPLOY_SHA }}"
          echo "  API URL:    ${{ env.API_BASE_URL }}"
          echo "  Site URL:   ${{ env.SITE_URL }}"
          echo "  Health:     ${{ steps.health.outcome }}"
          echo "  Markets:    ${{ steps.markets.outcome }}"
          echo "  Side Data:  ${{ steps.sidedata.outcome }}"
          echo "  Frontend:   ${{ steps.frontend.outcome }}"
          echo "========================================"

  # ── Auto-rollback on smoke test failure (both staging and production) ──
  rollback:
    needs: smoke-test
    if: failure() && needs.smoke-test.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_URL: https://backboard.railway.com/graphql/v2
      DEPLOY_BRANCH: ${{ needs.smoke-test.outputs.deploy_branch }}
      DEPLOY_SHA: ${{ needs.smoke-test.outputs.deploy_sha }}
      ENV_LABEL: ${{ needs.smoke-test.outputs.environment_label }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Rollback Railway deployment
        id: rollback
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PRODUCTION_PROJECT_ID: ${{ secrets.RAILWAY_PRODUCTION_PROJECT_ID }}
          RAILWAY_PRODUCTION_SERVICE_ID: ${{ secrets.RAILWAY_PRODUCTION_SERVICE_ID }}
          RAILWAY_PRODUCTION_ENVIRONMENT_ID: ${{ secrets.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
          RAILWAY_STAGING_PROJECT_ID: ${{ secrets.RAILWAY_STAGING_PROJECT_ID }}
          RAILWAY_STAGING_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_SERVICE_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ secrets.RAILWAY_STAGING_ENVIRONMENT_ID }}
        run: |
          TARGET_JSON=$(node --input-type=module -e "
            import { selectRailwayRollbackTarget } from './.github/scripts/deployment-smoke-test-helpers.mjs';
            const target = selectRailwayRollbackTarget(process.env.ENV_LABEL, {
              production: {
                projectId: process.env.RAILWAY_PRODUCTION_PROJECT_ID,
                serviceId: process.env.RAILWAY_PRODUCTION_SERVICE_ID,
                environmentId: process.env.RAILWAY_PRODUCTION_ENVIRONMENT_ID,
              },
              staging: {
                projectId: process.env.RAILWAY_STAGING_PROJECT_ID,
                serviceId: process.env.RAILWAY_STAGING_SERVICE_ID,
                environmentId: process.env.RAILWAY_STAGING_ENVIRONMENT_ID,
              },
            });
            console.log(JSON.stringify(target));
          ")
          RAILWAY_PROJECT_ID=$(echo "$TARGET_JSON" | jq -r '.projectId')
          RAILWAY_SERVICE_ID=$(echo "$TARGET_JSON" | jq -r '.serviceId')
          RAILWAY_ENVIRONMENT_ID=$(echo "$TARGET_JSON" | jq -r '.environmentId')

          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "⚠️ RAILWAY_API_TOKEN secret not configured — skipping auto-rollback"
            echo "💡 To enable auto-rollback, add these GitHub repo secrets:"
            echo "   RAILWAY_API_TOKEN"
            echo "   RAILWAY_STAGING_PROJECT_ID, RAILWAY_STAGING_SERVICE_ID, RAILWAY_STAGING_ENVIRONMENT_ID"
            echo "   RAILWAY_PRODUCTION_PROJECT_ID, RAILWAY_PRODUCTION_SERVICE_ID, RAILWAY_PRODUCTION_ENVIRONMENT_ID"
            echo "rollback_executed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_SERVICE_ID" ] || [ -z "$RAILWAY_ENVIRONMENT_ID" ]; then
            echo "⚠️ Railway ${{ env.ENV_LABEL }} secrets not configured — skipping auto-rollback"
            echo "rollback_executed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🔍 Fetching recent deployments for ${{ env.ENV_LABEL }}..."

          DEPLOYMENTS=$(curl -s -X POST "${{ env.RAILWAY_API_URL }}" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "query($input: DeploymentListInput!, $first: Int) { deployments(input: $input, first: $first) { edges { node { id status createdAt canRollback } } } }",
              "variables": {
                "input": {
                  "projectId": "'"$RAILWAY_PROJECT_ID"'",
                  "serviceId": "'"$RAILWAY_SERVICE_ID"'",
                  "environmentId": "'"$RAILWAY_ENVIRONMENT_ID"'"
                },
                "first": 5
              }
            }')

          echo "Deployments:"
          echo "$DEPLOYMENTS" | jq '.data.deployments.edges[].node | {id: .id[0:8], status, createdAt, canRollback}' 2>/dev/null

          # Prefer the newest rollback-eligible deploy that is not the list head (typical broken in-flight head has canRollback false).
          # If only one eligible target exists, use it — do not skip .[0] with .[1] (Codex P1).
          HEAD_ID=$(echo "$DEPLOYMENTS" | jq -r '.data.deployments.edges[0].node.id // empty')
          ROLLBACK_ID=$(echo "$DEPLOYMENTS" | jq -r --arg head "$HEAD_ID" '
            [.data.deployments.edges[].node | select(.canRollback == true and .id != $head)] | .[0].id // empty
          ')
          if [ -z "$ROLLBACK_ID" ]; then
            ROLLBACK_ID=$(echo "$DEPLOYMENTS" | jq -r '
              [.data.deployments.edges[].node | select(.canRollback == true)] | .[0].id // empty
            ')
          fi

          if [ -z "$ROLLBACK_ID" ]; then
            echo "❌ No rollback-eligible deployment found for ${{ env.ENV_LABEL }}"
            exit 1
          fi

          echo "🔄 Rolling back ${{ env.ENV_LABEL }} to deployment: ${ROLLBACK_ID:0:8}..."

          ROLLBACK_RESULT=$(curl -s -X POST "${{ env.RAILWAY_API_URL }}" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation($id: String!) { deploymentRollback(id: $id) }",
              "variables": { "id": "'"$ROLLBACK_ID"'" }
            }')

          if echo "$ROLLBACK_RESULT" | jq -e '.data.deploymentRollback == true' > /dev/null 2>&1; then
            echo "✅ Railway ${{ env.ENV_LABEL }} rolled back successfully"
            echo "rollback_executed=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Rollback failed:"
            echo "$ROLLBACK_RESULT" | jq . 2>/dev/null || echo "$ROLLBACK_RESULT"
            echo "rollback_executed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create rollback notification issue
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const helperUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/deployment-smoke-test-helpers.mjs`).href;
            const { createSmokeTestIssuePayload } = await import(helperUrl);
            const env = '${{ env.ENV_LABEL }}';
            const sha = '${{ env.DEPLOY_SHA }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const rollbackExecuted = '${{ steps.rollback.outputs.rollback_executed }}';
            const rollbackOutcome = '${{ steps.rollback.outcome }}' || 'unknown';
            const payload = createSmokeTestIssuePayload({
              environment: env,
              sha,
              runUrl,
              rollbackExecuted,
              rollbackOutcome,
            });

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: payload.title,
              body: payload.body,
              labels: ['smoke-test-failure'],
            });
