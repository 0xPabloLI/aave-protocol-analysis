# Regenerate `backend/src/generated/oracle-pool-configs.ts` from @aave-dao/aave-address-book; open auto-merged PR if changed.
name: Oracle pool config sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # Every day at 08:00 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: oracle-pool-config-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync oracle pool configs
        run: npm run sync:oracle-pool-configs

      - name: Verify build
        run: npm run build

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          commit-message: "chore: sync oracle pool configs from address book"
          branch: bot/sync-oracle-pool-configs-${{ github.run_id }}
          delete-branch: true
          title: "chore: sync oracle pool configs from @aave-dao/aave-address-book"
          body: |
            Automated update from `@aave-dao/aave-address-book`.

            Covers 23 V3 pool configs + 10 V4 spoke configs.
            Horizons (TREASURY_SPOKE) oracle is a manual override — not in address book.

      - name: Enable auto-merge
        if: steps.diff.outputs.changed == 'true'
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-url }}"
        env:
          GH_TOKEN: ${{ github.token }}