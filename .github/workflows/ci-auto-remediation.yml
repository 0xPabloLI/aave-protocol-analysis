name: CI Auto Remediation

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Include renovate/* so Renovate PR branches trigger remediation too.
    branches:
      - main
      - railway
      - renovate/**
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to remediate (default: repository default branch)"
        required: false
        type: string

concurrency:
  group: ci-auto-remediation-${{ github.event.workflow_run.head_branch || github.event.inputs.branch || 'default' }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  # The escalation step opens/updates an issue when remediation cannot produce a
  # fix. Without this scope that call fails with 403 "Resource not accessible by
  # integration", and — because the step tolerates failure — the escalation would
  # go missing silently (observed 2026-11-09).
  issues: write
  pull-requests: write

jobs:
  remediate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-latest
    # Railway's "Wait for CI" skips a deployment as soon as any workflow run on the
    # commit concludes in `failure`, and a `workflow_run` run is attributed to the
    # default branch's HEAD regardless of which branch actually triggered it. This
    # job therefore must never fail the run: remediation is best-effort, and
    # anything it cannot fix is escalated through an issue (see the last step).
    # https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idcontinue-on-error
    continue-on-error: true
    steps:
      - name: Check if CI failure is ERESOLVE (unfixable by audit)
        id: skip-check
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            core.setOutput('skip', 'false');
            const runId = context.payload.workflow_run.id;
            const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            for (const job of jobs) {
              if (job.conclusion !== 'failure') continue;
              let log;
              try {
                const resp = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: job.id,
                });
                log = resp.data;
              } catch (e) {
                core.warning(`Could not download logs for job ${job.name} (id=${job.id}): ${e.message}. Assuming no ERESOLVE.`);
                continue;
              }
              if (/npm error code ERESOLVE/.test(log)) {
                core.setOutput('skip', 'true');
                core.notice('CI failure contains ERESOLVE — peer dep conflict cannot be fixed by audit. Skipping.');
                return;
              }
            }

      - name: Skip remediation for ERESOLVE failures
        if: steps.skip-check.outputs.skip == 'true'
        run: exit 0
      - name: Resolve target branch
        if: steps.skip-check.outputs.skip != 'true'
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.branch }}" ]; then
            echo "name=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ] && [ -n "${{ github.event.workflow_run.head_branch }}" ]; then
            echo "name=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout target branch
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.branch.outputs.name }}

      - name: Setup Node
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"

      # Same pin as ci.yml. The lockfile is only valid for the npm version that
      # generated it: an unpinned npm rejects the @emnapi/* entries with EUSAGE
      # and fails this job (observed 2026-11-09).
      - name: Pin npm (lockfile validated with 11.6.2)
        if: steps.skip-check.outputs.skip != 'true'
        run: npm install -g npm@11.6.2

      # continue-on-error keeps the job alive past a failed install so the
      # escalation path below still runs; the `if` gates downstream steps on it,
      # since they are meaningless without node_modules.
      - name: Install dependencies
        id: install
        if: steps.skip-check.outputs.skip != 'true'
        continue-on-error: true
        run: npm ci

      - name: Attempt dependency remediation
        if: steps.skip-check.outputs.skip != 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          npm audit fix --omit=dev || true

      - name: Reinstall dependencies for build verification
        id: reinstall
        if: steps.skip-check.outputs.skip != 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm ci

      - name: Validate build after remediation
        if: steps.skip-check.outputs.skip != 'true' && steps.reinstall.outcome == 'success'
        id: verify
        run: |
          set +e
          npm run build
          BUILD_ROOT=$?
          npm run build -w aave-dashboard-backend
          BUILD_BACKEND=$?
          # Use the SAME gate as CI (`npm run audit`): root high + backend moderate,
          # with the shared GHSA allowlist. Mirroring CI guarantees we never open a
          # PR that the canonical security-audit job will reject.
          npm run audit
          AUDIT=$?
          if [ "$BUILD_ROOT" -eq 0 ] && [ "$BUILD_BACKEND" -eq 0 ] && [ "$AUDIT" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Check for generated changes
        if: steps.skip-check.outputs.skip != 'true' && steps.reinstall.outcome == 'success'
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create remediation PR
        id: cpr
        if: steps.skip-check.outputs.skip != 'true' && steps.verify.outputs.ok == 'true' && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          commit-message: "chore: auto-remediate dependency issues after CI failure"
          branch: "bot/ci-auto-remediation-${{ github.run_id }}"
          delete-branch: true
          title: "chore: auto remediation for CI failure (${{ steps.branch.outputs.name }})"
          body: |
            Auto-generated remediation PR.

            Trigger:
            - Event: `${{ github.event_name }}`
            - Source branch: `${{ steps.branch.outputs.name }}`

            Actions performed:
            - `npm audit fix --omit=dev`
            - `npm run build`
            - `npm run build -w aave-dashboard-backend`
          labels: ci-auto-remediation,dependencies
          base: ${{ steps.branch.outputs.name }}

      - name: Review and enable auto-merge for remediation PR
        if: steps.skip-check.outputs.skip != 'true' && steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.CODEX_BOT_TOKEN != '' && secrets.CODEX_BOT_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.cpr.outputs.pull-request-number }}');
            if (!prNumber) {
              core.info('No remediation PR created; skip review/auto-merge.');
              return;
            }

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: 'Automated review approval by CODEX_BOT_TOKEN.',
              });
            } catch (error) {
              core.warning(`Auto-approve failed for PR #${prNumber}: ${error.message}`);
            }
            try {
              await github.graphql(
                `
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                    pullRequest {
                      number
                    }
                  }
                }
                `,
                { pullRequestId: pr.data.node_id }
              );
            } catch (error) {
              core.warning(`Enable auto-merge failed for PR #${prNumber}: ${error.message}`);
            }

      # B2: When automated remediation cannot produce a passing fix (verify failed),
      # `npm audit fix` is the wrong tool for this repo's override-based vuln pattern.
      # Escalate to a human/agent via an issue instead of silently doing nothing.
      # A dependency install that never got off the ground is escalated the same way,
      # with a message that names the real failure.
      - name: Classify remediation failure
        if: steps.skip-check.outputs.skip != 'true' && steps.verify.outputs.ok != 'true'
        id: failure
        run: |
          if [ "${{ steps.install.outcome }}" != "success" ] || [ "${{ steps.reinstall.outcome }}" != "success" ]; then
            {
              echo 'summary=Dependency install (`npm ci`) failed, so remediation never ran.'
              echo 'advice=The lockfile does not satisfy `package.json` for the pinned npm version (or a registry fetch failed). Regenerate it with npm 11.6.2 and commit the result.'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'summary=`npm audit fix` did not produce a change that passes the canonical `npm run audit` gate.'
              echo 'advice=This repo fixes transitive vulnerabilities via `overrides` in `package.json`, which `npm audit fix` cannot do correctly. A human or agent should bump the relevant `overrides` (root and/or `backend`) to safe versions, as in PR #136.'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Read audit output for escalation
        if: steps.skip-check.outputs.skip != 'true' && steps.verify.outputs.ok != 'true'
        id: audit-out
        run: |
          # `cat <missing> | tail` exits 0, so a `|| echo` fallback never fires.
          # Test the file instead, so a skipped audit gate says so instead of
          # rendering an empty section.
          show() {
            if [ -s "$1" ]; then tail -60 "$1"; else echo "(no $2 audit output — the audit gate did not run)"; fi
          }
          {
            echo 'report<<AUDIT_EOF'
            echo '## Root audit (audit-level=high)'
            echo '```'
            show /tmp/_audit1 root
            echo '```'
            echo '## Backend audit (audit-level=moderate)'
            echo '```'
            show /tmp/_audit2 backend
            echo '```'
            echo AUDIT_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Escalate via issue when remediation fails
        if: steps.skip-check.outputs.skip != 'true' && steps.verify.outputs.ok != 'true'
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          # Passed through the environment instead of being interpolated into the
          # script: these values contain backticks, which would terminate a JS
          # template literal and make this step fail.
          FAILURE_SUMMARY: ${{ steps.failure.outputs.summary }}
          FAILURE_ADVICE: ${{ steps.failure.outputs.advice }}
          AUDIT_REPORT: ${{ steps.audit-out.outputs.report }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = '${{ steps.branch.outputs.name }}';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `Auto-remediation could not resolve the CI failure on \`${branch}\``;
            const marker = '<!-- ci-auto-remediation-failed -->';
            const body = [
              marker,
              `${process.env.FAILURE_SUMMARY} (branch \`${branch}\`).`,
              '',
              process.env.FAILURE_ADVICE,
              '',
              `Remediation run: ${runUrl}`,
              '',
              '<details><summary>Audit output</summary>',
              '',
              process.env.AUDIT_REPORT,
              '',
              '</details>',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'ci-auto-remediation',
            });
            const found = existing.data.find((i) => i.body && i.body.includes(marker) && i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: found.number,
                body: `Remediation failed again on \`${branch}\`.\n\nRun: ${runUrl}`,
              });
              core.notice(`Updated existing escalation issue #${found.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body, labels: ['ci-auto-remediation', 'dependencies'],
              });
              core.notice(`Opened escalation issue #${created.data.number}`);
            }
