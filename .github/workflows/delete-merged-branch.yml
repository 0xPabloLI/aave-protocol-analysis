name: Delete merged branch

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete merged branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          PROTECTED="main dev railway"
          for b in $PROTECTED; do
            if [ "$HEAD_REF" = "$b" ]; then
              echo "Skipping protected branch: $HEAD_REF"
              exit 0
            fi
          done
          echo "Deleting branch: $HEAD_REF"
        # GitHub already supports auto-delete via API
      - name: Delete ref
        if: >-
          github.event.pull_request.head.ref != 'main' &&
          github.event.pull_request.head.ref != 'dev' &&
          github.event.pull_request.head.ref != 'railway'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${context.payload.pull_request.head.ref}`,
            });
            console.log(`Deleted branch: ${context.payload.pull_request.head.ref}`);
