name: Subgraph Rate Inputs Health

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-change]
  schedule:
    # Every day at 02:50 UTC
    - cron: "50 2 * * *"

jobs:
  check-subgraph-rate-inputs-health:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Probe subgraph health for rate-input query compatibility
        env:
          THE_GRAPH_API_KEY: ${{ secrets.THE_GRAPH_API_KEY }}
        run: npm run subgraphs:check-rate-inputs

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subgraph-rate-inputs-health-report
          path: docs/api/subgraph-rate-inputs-health.snapshot.json
