name: Subgraph Sync

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-change]
  schedule:
    # Every day at 02:20 UTC
    - cron: "20 2 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-aave-subgraph-deployments:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync deployment snapshot
        run: npm run subgraphs:sync

      - name: Create PR when snapshot changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(subgraph): sync deployment snapshot"
          title: "chore(subgraph): sync deployment snapshot"
          body: |
            Automated update from `npm run subgraphs:sync`.
          branch: "bot/subgraph-sync-${{ github.run_id }}"
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          labels: |
            automation
            subgraph
