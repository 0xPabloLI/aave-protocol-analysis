name: Test Canary (flaky detection + build trend)

# Scheduled full-suite run with the extra network-touching guards enabled.
# Purpose: catch flaky tests outside the hot CI path. Hot-path `ci` runs the
# same suites with RUN_API_FIELDS_TESTS unset; here it is on, so the
# API-fields assertions run too.
# A failure here that passes in hot-path CI is a flakiness signal.
#
# It also owns build-duration trend tracking (AAV-1290): `ci.yml` records each
# run's duration in its own step summary, but a single run cannot say whether
# that number is normal. This workflow samples the build stage weekly, compares
# it against the median of recent canary runs, and opens an issue on regression.
#
# ⚠️ DEFAULT-BRANCH CONSTRAINT: a scheduled workflow only fires when this file
# exists on the repository's *default* branch (here `main`). A copy living only
# on a feature branch never runs, the workflow does not appear in
# `gh api repos/:owner/:repo/actions/workflows`, and the Actions API will not
# resolve it by file name at all. Verified 2026-09-17: uptime-alert.yml,
# test-canary.yml and dast-baseline.yml were all absent from `main` — so none of
# them had ever run, despite being committed on `railway`.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: "npm"

      # Same pin as ci.yml and the Dockerfile — enforced by
      # backend/tests/workflowNpmPins.test.ts.
      - name: Pin npm (lockfile validated with 11.6.2)
        run: npm install -g npm@11.6.2

      # One install covers every workspace. `npm ci --prefix backend` cannot
      # work: backend has no lockfile of its own (workspace root owns it).
      - name: Install root dependencies
        run: npm ci

      # Suites consume the workspace packages through their `exports` field,
      # which resolves to `dist/` — so the build has to happen first. This used
      # to run after the suites ("a timing change can never alter what the
      # suites see"), which in a clean checkout meant the suites saw no build
      # output at all and the canary never once went green (AAV-1376).
      # The step is not `continue-on-error`: a broken build is the failure to
      # report, and letting the suites run on top of it only muddies the cause.
      # `backend/tests/testCanaryOrder.test.ts` fails if this moves back down.
      - name: Build (timed)
        id: build
        shell: bash
        run: |
          start=$(date +%s)
          npm run build
          end=$(date +%s)
          echo "seconds=$(( end - start ))" >> "$GITHUB_OUTPUT"
          echo "Build stage: $(( end - start ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Run full suites with duration tracking
        shell: bash
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo "# Test canary — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "| Suite | Duration | Result |"
            echo "| ----- | -------- | ------ |"
          } >> "$SUMMARY"

          FAILED=0
          run_suite() {
            local name="$1"; shift
            local start end status
            start=$(date +%s)
            if "$@"; then status="✅ pass"; else status="❌ FAIL"; FAILED=$(( FAILED + 1 )); fi
            end=$(date +%s)
            echo "| ${name} | $(( end - start ))s | ${status} |" >> "$SUMMARY"
            [[ "$status" == "✅ pass" ]]
          }

          RUN_API_FIELDS_TESTS=true
          export RUN_API_FIELDS_TESTS

          # The API-fields assertions compare MARKETS_API_VERSION against the
          # deployed snapshot. Point them at the deployment this ref produces:
          # the schedule runs on `main` (= production), while every other ref
          # here is `railway` (= staging). The test defaults to staging, so a
          # version bump that reaches railway first would otherwise turn the
          # weekly main run red on correct code (AAV-1378).
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            export API_FIELDS_TEST_URL="https://api.aaveapy.com/api/markets"
          else
            export API_FIELDS_TEST_URL="https://staging-api.aaveapy.com/api/markets"
          fi

          run_suite "shared-contracts" npm run test -w @internal/aave-shared-contracts
          run_suite "root" npm test
          run_suite "rpc-infra" npm run test -w @internal/aave-rpc-infra
          run_suite "fetcher" npm run test -w @internal/aave-fetcher
          run_suite "backend" npm run test -w aave-dashboard-backend

          # Nothing here runs with `set -e`, so a failing suite in the middle
          # only returns non-zero into an ignored call site: the step would go
          # green as long as the last suite passed. Report the count explicitly
          # (AAV-1378).
          if (( FAILED > 0 )); then
            echo "" >> "$SUMMARY"
            echo "**${FAILED} suite(s) failed.**" >> "$SUMMARY"
            exit 1
          fi

      - name: Build duration trend
        if: always() && steps.build.outputs.seconds != ''
        env:
          # Only same-workflow runs are sampled, keeping the series
          # apples-to-apples — ci.yml measures a different command.
          TREND_WORKFLOW: test-canary.yml
          TREND_JOB: canary
          TREND_STEP: Build (timed)
          CURRENT_SECONDS: ${{ steps.build.outputs.seconds }}
          TREND_SAMPLE_SIZE: "20"
          # Alert only on a real jump: both bars must be cleared, so a 1s → 3s
          # wobble on a tiny baseline stays quiet.
          TREND_RATIO: "1.5"
          TREND_MIN_DELTA_SECONDS: "30"
          TREND_MIN_SAMPLES: "3"
          # Handed to the next step; kept explicit so both steps agree on the path.
          TREND_DECISION_PATH: ${{ runner.temp }}/ci-build-trend.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Always exits 0: a broken trend reading must not fail the canary, which
        # exists to detect flaky tests.
        run: node scripts/ci-build-trend.mjs

      - name: Open, update or close the regression issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TREND_DECISION_PATH: ${{ runner.temp }}/ci-build-trend.json
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const decisionPath = process.env.TREND_DECISION_PATH;

            if (!fs.existsSync(decisionPath)) {
              core.info('no trend decision this run — nothing to report');
              return;
            }
            const decision = JSON.parse(fs.readFileSync(decisionPath, 'utf8'));

            const title = '⚠️ CI build duration regression';

            // GitHub silently drops labels that do not exist at issue-create
            // time, and filtering by a label that does not exist matches
            // nothing. Together that means: no `ci-perf` label → the lookup
            // below never sees the previous issue → a fresh issue every week,
            // and the recovery path can never find it to close. Ensure both
            // labels exist before the query; failures stay warnings so the
            // regression is still reported.
            for (const [name, description] of [
              ['ci-perf', 'CI build duration regression'],
              ['needs-triage', 'Not triaged yet'],
            ]) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (lookupError) {
                if (lookupError.status !== 404) {
                  core.warning(`could not check label ${name}: ${lookupError.message}`);
                } else {
                  try {
                    await github.rest.issues.createLabel({
                      ...context.repo,
                      name,
                      color: 'ededed',
                      description,
                    });
                    core.info(`Created missing label ${name}`);
                  } catch (createError) {
                    // 422 = a concurrent run created it first.
                    if (createError.status !== 422) {
                      core.warning(`could not create label ${name}: ${createError.message}`);
                    }
                  }
                }
              }
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100, labels: 'ci-perf',
            });
            const existing = open.find((i) => i.title === title);

            if (decision.regressed) {
              const body = [
                `Build stage regressed at ${new Date().toISOString()}`,
                '',
                `- current: **${decision.current}s**`,
                `- median of last ${decision.sampleCount}: **${decision.baseline}s**`,
                `- decision: ${decision.reason}`,
                '',
                `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                '',
                'See the run summary for the full trend table.',
              ].join('\n');
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number, body,
                });
              } else {
                await github.rest.issues.create({
                  owner, repo, title, body, labels: ['ci-perf', 'needs-triage'],
                });
              }
            } else if (existing && decision.sampleCount >= 3) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body:
                  `✅ Build duration back within threshold at ${new Date().toISOString()}: ` +
                  `${decision.current}s vs median ${decision.baseline}s — closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed',
              });
            }

            core.info(
              `build=${decision.current}s baseline=${decision.baseline}s ` +
                `samples=${decision.sampleCount} regressed=${decision.regressed}`,
            );

      # Print the collected summary to the job log (the previous form appended the
      # file to itself, which only duplicated it).
      - name: Report
        if: always()
        run: cat "$GITHUB_STEP_SUMMARY" || true
