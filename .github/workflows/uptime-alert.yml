name: Uptime alert

# Custom alerting rule: probe both public health endpoints (staging and
# production) on a schedule; open or update a GitHub issue when a probe fails.
# This is the runtime alerting channel (complements CI auto-revert and
# deployment-smoke-test.yml, which only cover push-time failures).
#
# Runs on a GitHub-hosted runner every 15 minutes and only fires from the
# default branch (`main`) — a copy of this file on another branch is never
# scheduled. Verified 2026-11-11: both github-script refs here were 37-character
# SHAs, so every run since it reached main died in "Set up job" and this channel
# had never raised a single real alert. backend/tests/workflowActionPins.test.ts
# now fails if any action ref is not a full 40-character SHA.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe health endpoints
        id: probe
        continue-on-error: true
        run: |
          # Both environments are checked, staging first. Each target gets three
          # attempts 20s apart before it counts as down: production warms up for
          # ~3 minutes after every deploy and Railway restarts it on each `main`
          # push, so a single failed curl would page on every release and the
          # alert would be trained away within a week.
          fail=0
          for target in \
            "staging:https://staging-api.aaveapy.com/health" \
            "production:https://api.aaveapy.com/health"; do
            name="${target%%:*}"
            url="${target#*:}"
            code=000
            for attempt in 1 2 3; do
              # curl can print a status and still exit non-zero (the body died
              # mid-transfer), which would concatenate with a fallback echo.
              # Overwrite the whole value instead of appending to it.
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url") || code=000
              if [ "$code" = "200" ]; then
                break
              fi
              echo "$name attempt $attempt/3 -> HTTP $code"
              if [ "$attempt" -lt 3 ]; then
                sleep 20
              fi
            done
            echo "$name=$code" >> "$GITHUB_OUTPUT"
            echo "$name /health -> HTTP $code"
            if [ "$code" != "200" ]; then
              fail=1
            fi
          done
          exit $fail

      - name: Open or update alert issue
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = '⚠️ Uptime alert: health probe failing';
            const staging = '${{ steps.probe.outputs.staging }}';
            const production = '${{ steps.probe.outputs.production }}';
            const mark = (code) => (code === '200' ? '✅' : '❌');
            const body = [
              `Scheduled probe failed at ${new Date().toISOString()}`,
              '',
              `- ${mark(staging)} staging \`/health\` → HTTP \`${staging || 'not probed'}\``,
              `- ${mark(production)} production \`/health\` → HTTP \`${production || 'not probed'}\``,
              '',
              'Runbook: `docs/runbooks/backend-outage.md`.',
            ].join('\n');

            // GitHub silently drops labels that do not exist at issue-create
            // time. This step dedupes by title, so a dropped label would not
            // duplicate what it files — the alert would just be invisible to
            // any label-based triage. Ensure the labels exist first; a failure
            // here is a warning, never a reason to skip filing the alert.
            for (const [name, description] of [
              ['alerting', 'Runtime alert opened by a scheduled probe'],
              ['needs-triage', 'Not triaged yet'],
            ]) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (lookupError) {
                if (lookupError.status !== 404) {
                  core.warning(`could not check label ${name}: ${lookupError.message}`);
                } else {
                  try {
                    await github.rest.issues.createLabel({
                      ...context.repo,
                      name,
                      color: 'ededed',
                      description,
                    });
                    core.info(`Created missing label ${name}`);
                  } catch (createError) {
                    // 422 = a concurrent run created it first.
                    if (createError.status !== 422) {
                      core.warning(`could not create label ${name}: ${createError.message}`);
                    }
                  }
                }
              }
            }

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const alert = existing.find((i) => i.title === title);
            if (alert) {
              await github.rest.issues.createComment({ owner, repo, issue_number: alert.number, body });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ['alerting', 'needs-triage'],
              });
            }

      - name: Close alert issue on recovery
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = '⚠️ Uptime alert: health probe failing';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            for (const issue of open.filter((i) => i.title === title)) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `✅ Both probes healthy at ${new Date().toISOString()} — closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
