name: DAST baseline scan (OWASP ZAP)

# Weekly dynamic security scan against the staging deployment. Complements
# SAST (CodeQL) by testing the RUNNING application. Baseline scan = passive
# + light active checks; findings are uploaded as artifacts for triage.
# Non-blocking by design (informational) — review findings in the run artifact.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: ZAP baseline scan (staging API)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "https://staging-api.aaveapy.com"
          cmd_options: "-I -d"
          allow_issue_creation: "false"

      - name: Upload ZAP report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: ignore
