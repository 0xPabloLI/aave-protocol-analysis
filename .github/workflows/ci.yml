# CI: build + unused exports check (ts-prune)
# 与根目录 package.json 的 "ci" 脚本保持一致
# 触发：main / railway 的 push 与 PR
name: CI

on:
  push:
    branches:
      - main
      - railway
  pull_request:
    branches:
      - main
      - railway

permissions:
  contents: read

jobs:
  build-and-prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: CI (root + backend)
        run: npm run ci


  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci

      # Backend uses moderate: catches Express path-to-regexp 0.x advisories; elliptic/ethers may
      # still appear in npm audit output as low/informational when no upstream fix exists.
      - name: Audit runtime dependencies (root high, backend moderate)
        run: |
          set -e
          npm audit --omit=dev --audit-level=high || exit 1
          npm --prefix backend audit --omit=dev --audit-level=moderate || exit 1

  # NOTE: Auto-remediation is handled by ci-auto-remediation.yml workflow
  # (triggered via workflow_run event when this workflow fails)

  socket-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies via Socket Firewall (root + backend)
        run: |
          sfw npm ci
          (cd backend && sfw npm ci)
