# CI: build + unused exports check (ts-prune)
# 与根目录 package.json 的 "ci" 脚本保持一致
# 触发：任意分支 push / 任意 PR
name: CI

on:
  push:
    branches:
      - main
      - railway
      - feature/**
  pull_request:
    branches:
      - main
      - railway
      - feature/**

permissions:
  contents: read

jobs:
  build-and-prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: CI (root + backend)
        run: npm run ci


  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci

      - name: Audit runtime dependencies (High/Critical)
        run: |
          set -e
          npm audit --omit=dev --audit-level=high || exit 1
          npm --prefix backend audit --omit=dev --audit-level=high || exit 1

  # NOTE: Auto-remediation is handled by ci-auto-remediation.yml workflow
  # (triggered via workflow_run event when this workflow fails)
