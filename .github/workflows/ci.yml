# CI: build + unused exports check (ts-prune)
# 与根目录 package.json 的 "ci" 脚本保持一致
# 触发：main / railway 的 push 与 PR
name: CI

on:
  push:
    branches:
      - main
      - railway
  pull_request:
    branches:
      - main
      - railway

permissions:
  contents: write
  issues: write

jobs:
  build-and-prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: CI (root + backend)
        run: npm run ci

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies (shared script, excludes GHSA-848j-6mx2-7j84, GHSA-58qx-3vcg-4xpx, GHSA-frvp-7c67-39w9)
        # Known vulnerabilities that do not affect this project:
        # - GHSA-848j-6mx2-7j84: Elliptic risky crypto primitive - upstream fix pending
        # - GHSA-58qx-3vcg-4xpx: known, excluded
        # - GHSA-frvp-7c67-39w9: Hono serve-static path traversal on Windows only - backend runs on Linux
        # All other vulnerabilities must be fixed (npm audit fix) or explicitly excluded here.
        # continue-on-error: audit failures must not block PRs or trigger auto-revert.
        # npm registry can publish advisories with no fix available (e.g. elliptic) or
        # breaking-change fixes (e.g. @hono/node-server). A hard gate would freeze all
        # development on such events. Proactive Audit Fix (daily) handles remediation
        # without blocking. See ADR-0037 before removing this flag.
        continue-on-error: true
        run: npm run audit

  socket-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies via Socket Firewall (root workspace)
        run: sfw npm ci

  # Auto-revert: when CI fails on a direct push (not PR), revert the commit.
  # This is the safety net for `git push --no-verify` which bypasses the
  # local pre-push hook. The broken commit gets pushed, CI catches it,
  # and this job reverts it so the remote branch stays green.
  auto-revert-on-failure:
    needs: [build-and-prune, security-audit]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout target branch (full history for git revert)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.CODEX_BOT_TOKEN != '' && secrets.CODEX_BOT_TOKEN || github.token }}
          fetch-depth: 0

      - name: Revert the failing commit
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          git config user.name "CI Auto-Revert"
          git config user.email "actions@github.com"
          if git revert --no-edit "$SHA" 2>/dev/null; then
            git push origin "${{ github.ref_name }}"
            echo "reverted=true" >> "$GITHUB_OUTPUT"
            echo "Reverted commit $SHORT on ${{ github.ref_name }}"
          else
            echo "reverted=false" >> "$GITHUB_OUTPUT"
            echo "Could not revert $SHORT (possibly a merge commit or conflict)"
          fi
        id: revert

      - name: Create issue to notify
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.CODEX_BOT_TOKEN != '' && secrets.CODEX_BOT_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const sha = '${{ github.sha }}'.slice(0, 7);
            const branch = '${{ github.ref_name }}';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const reverted = '${{ steps.revert.outputs.reverted }}' === 'true';
            const title = `CI failed on push to ${branch} — ${sha}`;
            const body = [
              `## CI failed on direct push to \\`${branch}\``,
              '',
              `**Commit**: \`${sha}\``,
              `**CI run**: ${runUrl}`,
              '',
              reverted
                ? `✅ The commit has been **auto-reverted** on \`${branch}\`. Fix the issue and push again.`
                : `⚠️ Could not auto-revert (merge commit or conflict). **Manual intervention required.**`,
              '',
              '### How to prevent this',
              '',
              'This failure was not caught locally because either:',
              '1. **`git push --no-verify`** was used, bypassing the pre-push hook (`ci:remote`)',
              '2. The pre-commit hook did not cover this check at the time of commit',
              '',
              '**Do not use `--no-verify`.** If the hook fails, fix the issue instead of bypassing.',
            ].join('\n');
            await github.rest.issues.create({
              owner, repo, title, body, labels: ['ci-failure', 'auto-reverted']
            });
