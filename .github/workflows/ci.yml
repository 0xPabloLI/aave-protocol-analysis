# CI: build + unused exports check (ts-prune)
# 与根目录 package.json 的 "ci" 脚本保持一致
# 触发：任意分支 push / 任意 PR
name: CI

on:
  push:
    branches:
      - main
      - railway
      - feature/**
  pull_request:
    branches:
      - main
      - railway
      - feature/**

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: CI (root + backend)
        run: npm run ci


  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci

      - name: Audit runtime dependencies (High/Critical)
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix backend audit --omit=dev --audit-level=high

  auto-remediate-on-failure:
    needs:
      - build-and-prune
      - security-audit
    if: >
      always() &&
      github.event_name == 'push' &&
      !startsWith(github.ref_name, 'bot/ci-auto-remediation-') &&
      (needs.build-and-prune.result == 'failure' || needs.security-audit.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Attempt dependency remediation
        run: |
          npm audit fix --omit=dev || true
          npm --prefix backend audit fix --omit=dev || true

      - name: Reinstall dependencies for build verification
        run: |
          npm ci
          npm --prefix backend ci

      - name: Validate build after remediation
        id: verify
        run: |
          set +e
          npm run build
          BUILD_ROOT=$?
          npm --prefix backend run build
          BUILD_BACKEND=$?
          if [ "$BUILD_ROOT" -eq 0 ] && [ "$BUILD_BACKEND" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Check for generated changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create remediation PR
        id: cpr
        if: steps.verify.outputs.ok == 'true' && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: auto-remediate dependency issues after CI failure"
          branch: "bot/ci-auto-remediation-${{ github.run_id }}"
          delete-branch: true
          title: "chore: auto remediation for CI failure (${{ github.ref_name }})"
          body: |
            Auto-generated remediation PR.

            Trigger:
            - Event: `${{ github.event_name }}`
            - Source branch: `${{ github.ref_name }}`
            - Build and prune: `${{ needs.build-and-prune.result }}`
            - Security audit: `${{ needs.security-audit.result }}`

            Actions performed:
            - `npm audit fix --omit=dev`
            - `npm --prefix backend audit fix --omit=dev`
            - `npm run build`
            - `npm --prefix backend run build`
          labels: ci-auto-remediation,dependencies
          base: ${{ github.ref_name }}

      - name: Review and enable auto-merge for remediation PR
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.CODEX_BOT_TOKEN != '' && secrets.CODEX_BOT_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.cpr.outputs.pull-request-number }}');
            if (!prNumber) {
              core.info('No remediation PR created; skip review/auto-merge.');
              return;
            }

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: 'Automated review approval by CODEX_BOT_TOKEN.',
              });
            } catch (error) {
              core.warning(`Auto-approve failed for PR #${prNumber}: ${error.message}`);
            }
            try {
              await github.graphql(
                `
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                    pullRequest {
                      number
                    }
                  }
                }
                `,
                { pullRequestId: pr.data.node_id }
              );
            } catch (error) {
              core.warning(`Enable auto-merge failed for PR #${prNumber}: ${error.message}`);
            }
