# Regenerate `packages/aave-fetcher/src/generated/coingecko-platform-by-chain-id.ts` from CoinGecko + address book; open PR if changed.
name: CoinGecko platform map sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: coingecko-platform-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync platform map
        run: npm run sync:coingecko-platform-map

      - name: Verify build
        run: npm run build

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8
        with:
          commit-message: "chore: sync CoinGecko platform map"
          branch: bot/sync-coingecko-platform-map-${{ github.run_id }}
          delete-branch: true
          title: "chore: sync CoinGecko platform map"
          body: |
            Automated update of `packages/aave-fetcher/src/generated/coingecko-platform-by-chain-id.ts` from CoinGecko `asset_platforms` for Aave V3 mainnet chains in `@bgd-labs/aave-address-book`.

            Merge after CI passes.
