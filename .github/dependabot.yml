version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    # Disable regular version-update PRs; keep security updates enabled.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      patch-minor:
        update-types:
          - "patch"
          - "minor"
      major:
        update-types:
          - "major"

  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "03:10"
      timezone: UTC
    # Disable regular version-update PRs; keep security updates enabled.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      patch-minor:
        update-types:
          - "patch"
          - "minor"
      major:
        update-types:
          - "major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:20"
      timezone: UTC
    # Disable regular version-update PRs; keep security updates enabled.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      actions-all:
        patterns:
          - "*"
