version: 2
multi-ecosystem-groups:
  security-rollup:
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC

updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/backend"
      - "/workers"
    target-branch: "railway"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    multi-ecosystem-group: security-rollup
    patterns:
      - "*"
    # Disable regular version-update PRs; keep security updates enabled.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      security-all:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "railway"
    schedule:
      interval: weekly
      day: monday
      time: "03:20"
      timezone: UTC
    multi-ecosystem-group: security-rollup
    patterns:
      - "*"
    # Disable regular version-update PRs; keep security updates enabled.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      security-all:
        applies-to: security-updates
        patterns:
          - "*"
