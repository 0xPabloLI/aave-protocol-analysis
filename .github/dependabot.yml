version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    # Disable regular version-update PRs; keep security updates enabled.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      security-all:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
